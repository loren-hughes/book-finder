<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book Finder</title>
<style>
:root{--bg:#faf8f4;--fg:#1d1b18;--mut:#6b665e;--card:#fff;--bd:#e4dfd5;--ac:#2f6b4f;--on:#fff;--ok:#2f6b4f;--wait:#9a6a12;--buy:#6b665e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#171613;--fg:#ece8df;--mut:#a09a8e;--card:#201f1b;--bd:#35332d;--ac:#6fbf94;--on:#10200f;--ok:#6fbf94;--wait:#e0b050;--buy:#a09a8e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 0 8px}
input,button{font:inherit}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg)}
.go{padding:12px 16px;border:0;border-radius:10px;background:var(--ac);color:var(--on);font-weight:600}
.go:disabled{opacity:.5}
.ghost{padding:8px 14px;border:1px solid var(--bd);border-radius:10px;background:none;color:var(--fg)}
.hbtn{padding:5px 10px;border:1px solid var(--ac);border-radius:99px;background:none;color:var(--ac);font-size:13px;font-weight:600;white-space:nowrap}
.hbtn:disabled{opacity:.6}
.lnk{background:none;border:0;padding:0;color:var(--ac);text-decoration:underline;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0;font-size:18px}
.ti{cursor:pointer;display:inline}
.trow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ibtn{background:none;border:1px solid var(--bd);border-radius:99px;padding:2px 8px;color:var(--mut);font-size:13px;line-height:1.3;cursor:pointer;flex:none;white-space:nowrap}
.ibtn:hover,.ibtn.on{color:var(--ac);border-color:var(--ac)}
.rcard{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.rcard .rtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rcard .rmain{display:flex;gap:10px;align-items:center;min-width:0;flex:1;color:var(--fg);text-decoration:none;background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit}
.rcard .rmain small{display:block;color:var(--mut)}
.rcard .rright{display:flex;align-items:center;gap:6px;flex:none}
.rcard .desc{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--bd)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 12px}
.topbar h1{margin:0}
.hd{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.cv{width:56px;height:84px;border-radius:4px;background:var(--bd);flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:22px}
.rcv{width:40px;height:60px;font-size:16px}
.ci{width:100%;height:100%;object-fit:cover}
.by{color:var(--mut);font-size:14px}
.marks{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.mk{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid currentColor}
.desc{font-size:14px;color:var(--mut);margin:0 0 10px;white-space:pre-wrap;line-height:1.5}
.kind{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:10px 0 0}
.fmt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd);color:var(--fg);text-decoration:none}
.fmt small{display:block;color:var(--mut)}
.fl{color:inherit;text-decoration:none;min-width:0;flex:1}
.fr{display:flex;gap:8px;align-items:center;flex:none}
.b{font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.rb{white-space:normal;text-align:center;max-width:110px;line-height:1.25;flex:none}
.borrow_now,.ready{color:var(--ok)}.hold,.library_hold,.transit{color:var(--wait)}.spotify,.buy_used,.not_owned,.wait,.none{color:var(--buy)}
.price{font-weight:700;font-size:16px;white-space:nowrap}
.used{margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)}
.chips a{display:inline-block;margin:4px 8px 0 0;padding:6px 12px;border:1px solid var(--bd);border-radius:99px;color:var(--fg);text-decoration:none;font-size:14px}
.mut{color:var(--mut);font-size:14px}
.note{font-size:14px;margin:0 0 10px}
.saved{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:6px;color:var(--fg);text-decoration:none}
.saved small{display:block;color:var(--mut)}
.lft{display:flex;gap:10px;align-items:center;min-width:0}
.opt{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:14px;color:var(--mut);cursor:pointer;user-select:none}
.opt input{flex:none;width:auto;margin:0;padding:0;accent-color:var(--ac)}
.sel{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)}
.err{color:#b3261e;font-size:14px}
</style>
</head>
<body>
<main>
<div class="topbar"><h1>📚 Book Finder</h1><select id="view" class="sel" aria-label="View" hidden><option value="main">Search &amp; Library</option><option value="later">For Later (Library)</option><option value="wtr">Want to Read</option><option value="read">Read</option></select></div>
<div id="gate" hidden>
<p class="mut">Enter your access key once. It’s stored on this device only.</p>
<div class="row"><input id="key" type="password" placeholder="Access key" autocomplete="off"><button class="go" id="keybtn">Save</button></div>
<p class="err" id="keymsg"></p>
</div>
<div id="app" hidden>
<div id="banner" class="note" hidden></div>
<div id="v-main">
<div class="row" id="srow"><input id="q" type="search" placeholder="Title, author, ISBN, or paste screenshot" enterkeyhint="search" autocomplete="off"><button class="ghost" id="scanbtn" type="button" title="Scan book screenshot(s)">📷</button><input id="scanin" type="file" accept="image/*" multiple hidden><button class="go" id="go">Find</button></div>
<div id="out"></div>
<h2>Ask Book Assistant</h2>
<p class="mut" style="margin:0 0 8px">Describe what you want (e.g. “mixed media mosaic tile making” or “kids books with dragons”).</p>
<div class="row"><input id="askq" type="search" placeholder="Describe the book you’re looking for…" enterkeyhint="search" autocomplete="off"><button class="go" id="askbtn">Ask</button></div>
<div id="askstat" class="mut" style="margin-top:6px"></div>
<div id="askout" style="margin-top:8px"></div>
<h2>Recommended for you</h2>
<p class="mut" style="margin:0 0 8px">Based on your holds, searches, checkouts and Goodreads reading.</p>
<div class="row" style="align-items:center"><button class="go" id="recbtn">Get recommendations</button><span class="mut" id="recstat"></span></div>
<label class="opt"><input type="checkbox" id="exclco"> Exclude checkouts (avoids children’s books skewing picks)</label>
<div id="recs" style="margin-top:10px"></div>
<h2>My library</h2>
<div class="row" style="align-items:center;flex-wrap:wrap"><button class="ghost" id="libbtn">Refresh</button><select id="branch" class="sel" aria-label="Pickup branch"></select><button class="ghost" id="spbtn" hidden>Connect Spotify</button><span class="mut" id="libstat"></span></div>
<div id="lib"></div>
</div>
<div id="v-later" hidden>
<div class="row" style="margin-bottom:8px"><input id="laterq" type="search" placeholder="Filter For Later…" autocomplete="off"><button class="ghost" id="laterbtn" type="button">Refresh</button></div>
<label class="opt" style="margin-top:0;margin-bottom:8px"><input type="checkbox" id="lateravail"> Available now only</label>
<p class="mut" id="laterstat" style="margin:0 0 10px"></p>
<div id="laterlist"></div>
</div>
<div id="v-wtr" hidden>
<div class="row" style="margin-bottom:8px"><input id="wtrq" type="search" placeholder="Filter Want to Read…" autocomplete="off"><select id="wtrsort" class="sel" aria-label="Sort"><option value="added">Recently added</option><option value="title">Title A–Z</option><option value="author">Author A–Z</option></select></div>
<p class="mut" id="wtrstat" style="margin:0 0 10px"></p>
<div id="wtr"></div>
</div>
<div id="v-read" hidden>
<div class="row" style="margin-bottom:8px"><input id="readq" type="search" placeholder="Filter Read books…" autocomplete="off"></div>
<p class="mut" id="readstat" style="margin:0 0 10px"></p>
<div id="readlist"></div>
</div>
</div>
</main>
<script>
var BASE="https://yvsjixhwfjdwivhodjpv.supabase.co/functions/v1/";
var API=BASE+"search",LIB=BASE+"library",PRICES=BASE+"prices",RECS=BASE+"recs",GR=BASE+"goodreads",SPO=BASE+"spotify",SCAN=BASE+"scan",ASK=BASE+"ask";
var SRC={libby:"Libby",mcl:"Multnomah",spotify:"Spotify"};
var LBL={borrow_now:"Borrow now",hold:"Hold",library_hold:"Hold",spotify:"Premium",buy_used:"Buy used",not_owned:"Not owned",looking:"Looking",got_it:"Got it"};
var KINDS=["Print","Ebook","Audiobook","Magazine","Video"];
var BRANCHES=[["GRG","Gregory Heights"],["CEN","Central"],["HWD","Hollywood"],["BMT","Belmont"],["ALB","Albina"],["CAP","Capitol Hill"],["ECL","East County"],["FRV","Fairview-Columbia"],["HGT","Holgate"],["KEN","Kenton"],["LOS","Lake Oswego"],["MID","Midland"],["NPO","North Portland"],["NRW","Northwest"],["ROC","Rockwood"],["SEL","Sellwood-Moreland"],["STJ","St. Johns"],["TRT","Troutdale"],["WOD","Woodstock"],["MAIL","Books by Mail"]];
var E=encodeURIComponent;
var libData=null,laterData=null,readData=null,crData=[],wtrData=[],laterLimit=40,wtrLimit=30,readLimit=40,savedData=[],cards=[],showMags=false,lastRecs=null,spotifyOk=false;
function $(i){return document.getElementById(i)}
function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
function getKey(){try{return localStorage.getItem("bf_key")||""}catch(e){return ""}}
function setKey(v){try{localStorage.setItem("bf_key",v)}catch(e){}}
function safeUrl(u){try{var p=new URL(u,location.href);return (p.protocol==="https:"||p.protocol==="http:")?p.href:"#"}catch(e){return "#"}}
function apiFetch(u,opts){
opts=opts||{};var hdrs=Object.assign({"x-app-key":getKey()},opts.headers||{});
return fetch(u,Object.assign({},opts,{headers:hdrs}))}
function setView(v){
if(v!=="wtr"&&v!=="read"&&v!=="later")v="main";
$("v-main").hidden=(v!=="main");$("v-later").hidden=(v!=="later");$("v-wtr").hidden=(v!=="wtr");$("v-read").hidden=(v!=="read");
if($("view"))$("view").value=v;
try{localStorage.setItem("bf_view",v)}catch(e){}
if(location.hash!=="#"+v)try{history.replaceState(null,"","#"+v)}catch(e){}
if(v==="later"){renderLater();if(!laterData)laterLoad(false)}
if(v==="wtr")renderWtr();
if(v==="read")renderRead()}
function savedView(){
var h=(location.hash||"").replace(/^#/,"");
if(h==="wtr"||h==="read"||h==="later"||h==="main")return h;
try{var s=localStorage.getItem("bf_view");if(s==="wtr"||s==="read"||s==="later"||s==="main")return s}catch(e){}
return "main"}
function checkSpotify(){
var sp=$("spbtn");if(!sp)return;
var qp=new URLSearchParams(location.search);
if(qp.get("spotify")==="connected"){var bn=$("banner");bn.textContent="Spotify connected ✓ — you can now save audiobooks to your Spotify library.";bn.style.color="var(--ok)";bn.hidden=false;try{history.replaceState(null,"",location.pathname+location.hash)}catch(e){}}
else if(qp.get("spotify_error")){var bn2=$("banner");bn2.textContent="Spotify connect failed: "+qp.get("spotify_error");bn2.style.color="#b3261e";bn2.hidden=false;try{history.replaceState(null,"",location.pathname+location.hash)}catch(e){}}
fetch(SPO+"?action=status",{headers:{"x-app-key":getKey()}}).then(function(r){return r.json()}).then(function(d){
spotifyOk=!!d.connected;sp.hidden=false;
sp.textContent=spotifyOk?"Spotify ✓":"Connect Spotify";
sp.onclick=function(){window.open(SPO+"?k="+E(getKey())+"&action=auth","_blank","noopener")}}).catch(function(){})}
function spSavedMap(){try{return JSON.parse(localStorage.getItem("bf_sp_saved")||"{}")}catch(e){return {}}}
function isSpSaved(id){return !!(id&&spSavedMap()[id])}
function markSpSaved(id){if(!id)return;try{var m=spSavedMap();m[id]=1;localStorage.setItem("bf_sp_saved",JSON.stringify(m))}catch(e){}}
function saveSpotify(f,btn){
if(!spotifyOk){window.open(SPO+"?k="+E(getKey())+"&action=auth","_blank","noopener");return}
btn.disabled=true;btn.textContent="Saving…";
apiFetch(SPO+"?action=save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:f.url,id:f.id||""})}).then(function(r){return r.json()}).then(function(d){
if(d.ok){btn.textContent="Saved ✓";markSpSaved(f.id||d.id)}
else if(d.error==="not_connected"){spotifyOk=false;btn.disabled=false;btn.textContent="Connect Spotify";window.open(SPO+"?k="+E(getKey())+"&action=auth","_blank","noopener")}
else{btn.disabled=false;btn.textContent="+ Save";alert("Couldn’t save to Spotify: "+(d.error||"unknown error"))}
}).catch(function(e){btn.disabled=false;btn.textContent="+ Save";alert("Couldn’t save to Spotify: "+e.message)})}
function handleDeepLink(){
var qp=new URLSearchParams(location.search);
var q=qp.get("q"),booksParam=qp.get("books"),scanErr=qp.get("scan_error");
if(!q&&!booksParam&&!scanErr)return;
try{history.replaceState(null,"",location.pathname+location.hash)}catch(e){}
setView("main");
if(scanErr){$("out").textContent="";$("out").appendChild(el("p","err","Couldn’t read screenshot: "+scanErr));return}
if(q){search(q);return}
if(booksParam){try{var bs=JSON.parse(booksParam);if(Array.isArray(bs)&&bs.length)showScannedBooks(bs)}catch(e){}}}
function boot(){var k=getKey();$("gate").hidden=!!k;$("app").hidden=!k;$("view").hidden=!k;if(k){setView(savedView());loadSaved();libLoad(false).then(function(){laterLoad(false)});grLoad();crLoad();wtrLoad();recsCached();checkSpotify();handleDeepLink()}}
function tryKey(){
var v=$("key").value.trim();var m=$("keymsg");m.textContent="";if(!v){m.textContent="Enter your access key.";return}
var b=$("keybtn");b.disabled=true;b.textContent="Checking…";
apiFetch(API+"?saved=1",{headers:{"x-app-key":v}}).then(function(r){
if(r.status===401){m.textContent="That key isn't right. Try again.";return}
if(!r.ok){m.textContent="Server error ("+r.status+"). Try again in a moment.";return}
setKey(v);$("key").value="";boot()
}).catch(function(){m.textContent="Couldn't reach the server. Check your connection."}).then(function(){b.disabled=false;b.textContent="Save"})}
$("keybtn").onclick=tryKey;
$("key").addEventListener("keydown",function(e){if(e.key==="Enter")tryKey()});
function call(params){return apiFetch(API+"?"+params.replace(/^&/,"")).then(function(r){if(r.status===401){setKey("");boot();throw new Error("Wrong access key")}return r.json()})}
function kind(f){var s=(f.format||"").toLowerCase();if(f.source==="spotify"||/audio|on cd/.test(s))return"Audiobook";if(/ebook|e-book|digital/.test(s))return"Ebook";if(/magazine|periodical/.test(s))return"Magazine";if(/dvd|blu|video|film/.test(s))return"Video";return"Print"}
function wait(f){if(f.rank==="borrow_now")return"Available";var p=[];if(f.waitDays)p.push("~"+f.waitDays+" days");if(f.holds)p.push(f.holds+" holds");return p.join(" · ")||(f.note||"")}
function $$(n){return "$"+Number(n).toFixed(2)}
function nk(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim()}
function sn(a){if(!a)return"";var s=a.indexOf(",")>-1?a.split(",")[0]:a.trim().split(/\s+/).pop();return nk(s)}
function same(t1,a1,t2,a2){var x=nk(t1),y=nk(t2);if(!x||!y)return false;if(x!==y&&x.indexOf(y)!==0&&y.indexOf(x)!==0)return false;var s1=sn(a1),s2=sn(a2);return !s1||!s2||s1===s2}
function waitTxt(d){return d<14?("~"+d+" days"):("~"+Math.max(2,Math.round(d/7))+" wks")}
function dueTxt(d){if(!d)return"";try{var dt=new Date(d+"T00:00:00");return isNaN(dt.getTime())?d:dt.toLocaleDateString(undefined,{month:"short",day:"numeric"})}catch(e){return d}}
function recId(f){var x=/\/record\/(S\d+C\d+)/.exec(f.url||"");return x?x[1]:""}
function printHeld(w){
if(!libData)return false;
var ids=(w.formats||[]).map(recId).filter(Boolean);
return (libData.holds.items||[]).some(function(h){return !h.digital&&h.kind!=="digital"&&h.kind!=="Ebook"&&h.kind!=="Audiobook"&&(ids.indexOf(h.id)>-1||same(w.title,w.author,h.title,h.author))})}
function marksFor(w){
var m=[];
var ids=(w.formats||[]).map(recId).filter(Boolean);
if(readData){var r=null;readData.forEach(function(b){if(!r&&same(w.title,w.author,b.title,b.author))r=b});
if(r)m.push(["Read"+(r.rating?" ★"+r.rating:""),"ready"])}
if(libData){
(libData.holds.items||[]).forEach(function(h){
if(!(ids.indexOf(h.id)>-1||same(w.title,w.author,h.title,h.author)))return;
var k=h.digital||h.kind==="digital"||h.kind==="Ebook"||h.kind==="Audiobook"?(" ("+(h.kind&&h.kind!=="digital"?h.kind:"Ebook")+")"):"";
if(h.status==="READY_FOR_PICKUP")m.push(["Ready for pickup"+(h.pickup?" · "+h.pickup:"")+(h.pickupBy?" · by "+dueTxt(h.pickupBy):""),"ready"]);
else if(h.status==="IN_TRANSIT")m.push(["In transit to you","transit"]);
else m.push(["On hold #"+h.position+k,"wait"])});
(libData.checkedOut.items||[]).forEach(function(c){
if(!(ids.indexOf(c.id)>-1||same(w.title,w.author,c.title,c.author)))return;
var ck=c.digital||c.kind==="digital"||c.kind==="Ebook"||c.kind==="Audiobook"?(" ("+(c.kind&&c.kind!=="digital"?c.kind:"Ebook")+")"):"";
m.push(["Checked out · due "+dueTxt(c.due)+ck,c.status==="COMING_DUE"?"transit":"ready"])})}
return m}
function applyMarks(){
cards.forEach(function(c){
c.slot.textContent="";
marksFor(c.w).forEach(function(x){c.slot.appendChild(el("span","mk "+x[1],x[0]))});
if(c.holdBtn&&printHeld(c.w)){c.holdBtn.disabled=true;c.holdBtn.textContent="On hold ✓"}})}
var covCache={},olQ=[],olRun=0;
function pumpOl(){
while(olRun<4&&olQ.length){
var job=olQ.shift();olRun++;
fetch("https://openlibrary.org/search.json?limit=1&fields=cover_i&title="+E(job.title)+(job.author?"&author="+E(job.author):""))
.then(function(r){return r.json()}).then(function(j){
var id=j.docs&&j.docs[0]&&j.docs[0].cover_i;
var u=id?"https://covers.openlibrary.org/b/id/"+id+"-M.jpg":"";
covCache[job.k]=u;if(u)job.load(u,false)
}).catch(function(){}).then(function(){olRun--;pumpOl()})}}
function setCover(box,w){
var k=nk(w.title)+"|"+sn(w.author);
function load(u,fb){
var im=new Image();
im.onload=function(){if(im.naturalWidth>1){covCache[k]=u;box.textContent="";im.className="ci";box.appendChild(im)}else if(fb)fb()};
im.onerror=function(){if(fb)fb()};
im.referrerPolicy="no-referrer";im.src=u}
function ol(){if(k in covCache){if(covCache[k])load(covCache[k],null);return}olQ.push({k:k,title:w.title,author:w.author,load:load});pumpOl()}
if(covCache[k]){load(covCache[k],null);return}
if(w.cover){load(w.cover,w.isbn?function(){load("https://covers.openlibrary.org/b/isbn/"+E(w.isbn)+"-M.jpg?default=false",ol)}:ol);return}
if(w.isbn){load("https://covers.openlibrary.org/b/isbn/"+E(w.isbn)+"-M.jpg?default=false",ol);return}
ol()}
function htmlText(h){var d=new DOMParser().parseFromString(String(h||"").replace(/<\/p>\s*<p[^>]*>/gi,"\n\n").replace(/<br\s*\/?>/gi,"\n"),"text/html");return (d.body.textContent||"").replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim()}
function olDesc(w,done){
fetch("https://openlibrary.org/search.json?limit=1&fields=key&title="+E(w.title)+(w.author?"&author="+E(w.author):"")).then(function(r){return r.json()}).then(function(j){var k=j.docs&&j.docs[0]&&j.docs[0].key;if(!k)throw 0;return fetch("https://openlibrary.org"+k+".json")}).then(function(r){return r.json()}).then(function(d){var t=d.description;if(t&&t.value)t=t.value;done(t?String(t).trim():"")}).catch(function(){done("")})}
function libbyId(w){var fs=(w&&w.formats)||[];for(var i=0;i<fs.length;i++){var m=/overdrive\.com\/media\/(\d+)/.exec(fs[i].url||"");if(m)return m[1]}return ""}
function fullDesc(w,done){
var id=libbyId(w);

resolve({data:cv.toDataURL("image/jpeg",0.82),mime_type:"image/jpeg"})};
